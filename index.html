<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard - Clock & Weather</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: row;
        }

        /* Main Dashboard Content */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-width: 0; 
        }

        /* Side Panel Styling */
        #side-panel {
            width: 0;
            height: 100vh;
            background: #111;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 0px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #side-panel.open {
            width: 30vw; 
            min-width: 400px;
            border-left: 1px solid #333;
        }

        /* Analog Clock Styling */
        #clock-wrapper {
            position: relative;
            width: 380px;
            height: 380px;
            flex-shrink: 0;
        }

        #clock-face {
            position: absolute;
            inset: 0;
            border: 8px solid #333;
            border-radius: 50%;
            background: radial-gradient(circle, #111 0%, #000 100%);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.05);
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            z-index: 10;
            will-change: transform;
        }

        .hour-hand { width: 10px; height: 90px; background: #fff; margin-left: -5px; }
        .min-hand { width: 6px; height: 140px; background: #aaa; margin-left: -3px; }
        .second-hand { width: 2px; height: 170px; background: #ff3b30; z-index: 11; margin-left: -1px; }

        .center-dot {
            position: absolute; width: 16px; height: 16px; background: #ff3b30;
            border-radius: 50%; z-index: 12; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        .marking {
            position: absolute; top: 50%; left: 50%; width: 2px; height: 16px;
            background: #444; transform-origin: center 170px; margin-top: -170px; margin-left: -1px;
        }

        .marking.major { height: 28px; width: 6px; background: #888; margin-left: -3px; }

        /* Digital Clock Container - Fixed dynamic sizing */
        #digital-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            min-width: 0;
            padding: 0 4vw;
            height: 100%;
        }

        #digital-clock-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        #digital-clock {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            line-height: 0.85;
            letter-spacing: -0.05em;
            white-space: nowrap;
        }

        #current-date {
            margin-top: 1rem;
            white-space: nowrap;
        }

        .weather-icon { width: 64px; height: 64px; fill: currentColor; }
        
        .forecast-card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
            padding: 1rem;
        }
        
        .current-weather-box { border-right: 1px solid #222; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .dots { animation: pulse 1s infinite; }

        .action-bar { position: absolute; top: 20px; right: 20px; display: flex; gap: 12px; z-index: 100; }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3); width: 44px; height: 44px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease;
        }

        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.8); }
        .icon-btn.active { color: #fff; background: rgba(255, 255, 255, 0.2); border-color: #fff; }
        
        .icon-btn.twitch:hover { color: #9146ff; border-color: rgba(145, 70, 255, 0.5); }
        .icon-btn.spotify:hover { color: #1DB954; border-color: rgba(29, 185, 84, 0.5); }
        .icon-btn.ventusky:hover { color: #3b82f6; border-color: rgba(59, 130, 246, 0.5); }

        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); color: black; padding: 12px 24px;
            border-radius: 30px; font-weight: 600; opacity: 0; transition: opacity 0.3s ease;
            pointer-events: none; z-index: 200;
        }
    </style>
</head>
<body>

    <div id="toast">Playlist Active</div>

    <!-- Main Content Wrapper -->
    <div id="main-content" class="p-8 lg:p-12">
        <div class="action-bar">
            <!-- Ventusky Button -->
            <button id="ventusky-btn" class="icon-btn ventusky" title="Toggle Ventusky Weather Map">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
            </button>
            <!-- Twitch Button -->
            <button id="twitch-btn" class="icon-btn twitch" title="Open Twitch in Panel">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
                </svg>
            </button>
            <!-- Spotify Button -->
            <button id="spotify-btn" class="icon-btn spotify" title="Toggle Spotify Playlist">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.508 17.302c-.216.354-.675.466-1.028.249-2.854-1.744-6.447-2.138-10.683-1.171-.405.092-.813-.16-.905-.565-.092-.404.161-.812.566-.904 4.591-1.05 8.563-.598 11.782 1.365.353.216.465.675.248 1.026zm1.474-3.26c-.273.443-.852.585-1.296.312-3.267-2.008-8.247-2.592-12.11-1.419-.496.15-1.022-.128-1.173-.625-.15-.496.128-1.022.625-1.172 4.417-1.34 9.914-.686 13.642 1.608.444.272.586.852.312 1.296zm.126-3.414c-3.92-2.328-10.386-2.544-14.135-1.406-.602.183-1.238-.163-1.42-.765-.183-.602.163-1.238.765-1.42 4.295-1.304 11.43-1.052 15.952 1.631.541.32.718 1.022.398 1.562-.32.541-1.022.718-1.562.398z"/>
                </svg>
            </button>
            <button id="fullscreen-btn" class="icon-btn" title="Toggle Fullscreen">
                <svg id="fs-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
        </div>

        <!-- TOP SECTION -->
        <div class="flex-[3] flex flex-row items-center justify-between overflow-hidden gap-10">
            <!-- Analog Container -->
            <div class="flex-none flex justify-center items-center pl-10">
                <div id="clock-wrapper">
                    <div id="clock-face">
                        <div id="markings-container" class="absolute inset-0"></div>
                        <div class="center-dot"></div>
                        <div id="hour-hand" class="hand hour-hand"></div>
                        <div id="min-hand" class="hand min-hand"></div>
                        <div id="second-hand" class="hand second-hand"></div>
                    </div>
                </div>
            </div>

            <!-- Digital Side -->
            <div id="digital-side">
                <div id="digital-clock-container">
                    <div id="digital-clock" class="text-white">00:00</div>
                    <div id="current-date" class="text-gray-400 tracking-widest uppercase text-right">---, --- --</div>
                </div>
            </div>
        </div>

        <!-- BOTTOM SECTION -->
        <div class="flex-1 mt-8 grid grid-cols-12 gap-6 items-stretch border-t border-white/10 pt-8 w-full">
            <div class="col-span-4 current-weather-box flex items-center justify-center space-x-6 p-4">
                <div id="current-weather-icon" class="text-blue-400"></div>
                <div>
                    <div id="current-temp" class="text-5xl lg:text-7xl font-bold leading-none">--°</div>
                    <div id="current-desc" class="text-xl lg:text-2xl text-gray-400 font-light mt-1 text-ellipsis overflow-hidden">---</div>
                    <div id="current-extremes" class="text-lg text-gray-500 font-medium">H: --° L: --°</div>
                </div>
            </div>
            <div id="forecast-container" class="col-span-8 grid grid-cols-5 gap-4">
                <!-- Cards injected here -->
            </div>
        </div>
    </div>

    <!-- Side Panel (Right) -->
    <div id="side-panel">
        <div class="p-3 border-b border-white/10 flex justify-between items-center bg-black">
            <span id="panel-title" class="text-xs font-bold text-gray-500 uppercase tracking-widest pl-2">Panel</span>
            <button id="close-panel" class="text-gray-500 hover:text-white p-2">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <!-- Set height to 100% minus header -->
        <iframe id="side-iframe" src="about:blank" class="flex-1 w-full border-none" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <script>
        const icons = {
            sunny: `<svg class="weather-icon text-yellow-400" viewBox="0 0 24 24"><path d="M12,7c-2.76,0-5,2.24-5,5s2.24,5,5,5s5-2.24,5-5S14.76,7,12,7L12,7z M2,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S1.45,13,2,13L2,13z M20,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S19.45,13,20,13L20,13z M11,2l0,2c0,0.55,0.45,1,1,1s1-0.45,1-1l0-2c0-0.55-0.45-1-1-1S11,1.45,11,2L11,2z M11,20l0,2c0,0.55,0.45,1,1,1s1-0.45,1-1l0-2c0-0.55-0.45-1-1-1S11,19.45,11,20L11,20z M5.99,4.58c-0.39-0.39-1.03-0.39-1.41,0s-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0s0.39-1.03,0-1.41L5.99,4.58z M18.36,16.95c-0.39-0.39-1.03-0.39-1.41,0s-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0s0.39-1.03,0-1.41L18.36,16.95z M5.99,19.42l1.06-1.06c0.39-0.39,0.39-1.03,0-1.41s-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41S5.6,19.81,5.99,19.42z M18.36,7.05l1.06-1.06c0.39-0.39,0.39-1.03,0-1.41s-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41S17.97,7.44,18.36,7.05z"/></svg>`,
            cloudy: `<svg class="weather-icon text-gray-400" viewBox="0 0 24 24"><path d="M19.35,10.04C18.67,6.59,15.64,4,12,4C9.11,4,6.6,5.64,5.35,8.04C2.34,8.36,0,10.91,0,14c0,3.31,2.69,6,6,6h13 c2.76,0,5-2.24,5-5C24,12.36,21.95,10.22,19.35,10.04z"/></svg>`,
            rain: `<svg class="weather-icon text-blue-400" viewBox="0 0 24 24"><path d="M19.35,10.04C18.67,6.59,15.64,4,12,4C9.11,4,6.6,5.64,5.35,8.04C2.34,8.36,0,10.91,0,14c0,3.31,2.69,6,6,6h13 c2.76,0,5-2.24,5-5C24,12.36,21.95,10.22,19.35,10.04z M13,13v3h-2v-3H13z M17,13v3h-2v-3H17z M9,13v3H7v-3H9z"/></svg>`,
            thunder: `<svg class="weather-icon text-purple-400" viewBox="0 0 24 24"><path d="M19.35,10.04C18.67,6.59,15.64,4,12,4C9.11,4,6.6,5.64,5.35,8.04C2.34,8.36,0,10.91,0,14c0,3.31,2.69,6,6,6h13 c2.76,0,5-2.24,5-5C24,12.36,21.95,10.22,19.35,10.04z M9,21l3-3h-2l3-5l-3,3h2l-3,5z"/></svg>`
        };

        // --- SMART DYNAMIC RESIZING LOGIC ---
        function fitText() {
            const clock = document.getElementById('digital-clock');
            const date = document.getElementById('current-date');
            const container = document.getElementById('digital-side');
            if (!clock || !container) return;
            
            const maxWidth = container.offsetWidth * 0.85;
            const maxHeight = container.offsetHeight * 0.7;

            let fontSize = 450; 
            clock.style.fontSize = fontSize + 'px';

            // Fast reduce loop
            while ((clock.offsetWidth > maxWidth || clock.offsetHeight > maxHeight) && fontSize > 20) {
                fontSize -= (fontSize > 100 ? 5 : 2);
                clock.style.fontSize = fontSize + 'px';
            }

            date.style.fontSize = (fontSize * 0.22) + 'px';
        }

        const resizeObserver = new ResizeObserver(() => {
            fitText();
        });
        resizeObserver.observe(document.getElementById('digital-side'));

        function initClockMarkings() {
            const container = document.getElementById('markings-container');
            for (let i = 0; i < 60; i++) {
                const mark = document.createElement('div');
                mark.className = i % 5 === 0 ? 'marking major' : 'marking';
                mark.style.transform = `rotate(${i * 6}deg)`;
                container.appendChild(mark);
            }
        }

        const fsBtn = document.getElementById('fullscreen-btn');
        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        // --- PANEL LOGIC ---
        const vBtn = document.getElementById('ventusky-btn');
        const tBtn = document.getElementById('twitch-btn');
        const sBtn = document.getElementById('spotify-btn');
        const mainContent = document.getElementById('main-content');
        const sidePanel = document.getElementById('side-panel');
        const sideIframe = document.getElementById('side-iframe');
        const closePanel = document.getElementById('close-panel');
        const panelTitle = document.getElementById('panel-title');

        let currentActive = null;

        function closePanelFn() {
            sidePanel.classList.remove('open');
            mainContent.classList.remove('panel-open');
            vBtn.classList.remove('active');
            tBtn.classList.remove('active');
            sBtn.classList.remove('active');
            sideIframe.src = "about:blank";
            currentActive = null;
        }

        function openPanel(type) {
            sidePanel.classList.add('open');
            mainContent.classList.add('panel-open');
            
            // Sync active button states
            vBtn.classList.toggle('active', type === 'ventusky');
            tBtn.classList.toggle('active', type === 'twitch');
            sBtn.classList.toggle('active', type === 'spotify');

            if (type === 'ventusky') {
                panelTitle.innerText = "Wind Gusts Map";
                sideIframe.src = "https://www.ventusky.com/wind-gusts-map/1-hour#p=11.6;122.4;4";
            } else if (type === 'twitch') {
                panelTitle.innerText = "Twitch Directory";
                sideIframe.src = "https://www.twitch.tv/directory";
            } else if (type === 'spotify') {
                panelTitle.innerText = "Spotify Playlist";
                // Converting standard playlist URL to Embed format for iframe compatibility
                sideIframe.src = "https://open.spotify.com/embed/playlist/37i9dQZF1DWZKNkQDWII13?utm_source=generator&theme=0";
            }
            currentActive = type;
        }

        vBtn.addEventListener('click', () => {
            if (currentActive === 'ventusky') closePanelFn();
            else openPanel('ventusky');
        });

        tBtn.addEventListener('click', () => {
            if (currentActive === 'twitch') closePanelFn();
            else openPanel('twitch');
        });

        sBtn.addEventListener('click', () => {
            if (currentActive === 'spotify') closePanelFn();
            else openPanel('spotify');
        });

        closePanel.addEventListener('click', closePanelFn);

        document.addEventListener('fullscreenchange', () => {
            const icon = document.getElementById('fs-icon');
            if (document.fullscreenElement) {
                icon.innerHTML = '<path d="M4 14h6m0 0v6m0-6L3 21m17-7h-6m0 0v6m0-6 7 7M4 10h6m0 0V4m0 6L3 3m17 7h-6m0 0V4m0 6 7-7"></path>';
            } else {
                icon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>';
            }
        });

        // --- CLOCK ANIMATION ---
        let lastSecond = -1;
        function animateClock() {
            const now = new Date();
            const ms = now.getMilliseconds();
            const sec = now.getSeconds();
            const min = now.getMinutes();
            const hr = now.getHours();

            const smoothSec = sec + (ms / 1000);
            const smoothMin = min + (smoothSec / 60);
            const smoothHr = (hr % 12) + (smoothMin / 60);

            document.getElementById('second-hand').style.transform = `rotate(${smoothSec * 6}deg)`;
            document.getElementById('min-hand').style.transform = `rotate(${smoothMin * 6}deg)`;
            document.getElementById('hour-hand').style.transform = `rotate(${smoothHr * 30}deg)`;

            if (sec !== lastSecond) {
                const hStr = hr.toString().padStart(2, '0');
                const mStr = min.toString().padStart(2, '0');
                document.getElementById('digital-clock').innerHTML = `${hStr}<span class="dots text-gray-600">:</span>${mStr}`;
                const options = { weekday: 'short', month: 'short', day: '2-digit' };
                document.getElementById('current-date').innerText = now.toLocaleDateString('en-US', options);
                lastSecond = sec;
            }
            requestAnimationFrame(animateClock);
        }

        function renderWeather() {
            const now = new Date();
            document.getElementById('current-temp').innerText = `24°`;
            document.getElementById('current-desc').innerText = "Partly Cloudy";
            document.getElementById('current-extremes').innerText = "H: 28° L: 19°";
            document.getElementById('current-weather-icon').innerHTML = icons['cloudy'];

            const container = document.getElementById('forecast-container');
            container.innerHTML = '';
            const dayNames = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
            
            for (let i = 1; i <= 5; i++) {
                const forecastDate = new Date();
                forecastDate.setDate(now.getDate() + i);
                const dayLabel = dayNames[forecastDate.getDay()];
                const mockIcon = ['sunny', 'cloudy', 'rain', 'thunder'][(forecastDate.getDay()) % 4];
                const card = document.createElement('div');
                card.className = "forecast-card";
                card.innerHTML = `
                    <div class="text-xs lg:text-sm font-semibold mb-2 text-gray-400">${dayLabel}</div>
                    <div class="mb-2 scale-75">${icons[mockIcon]}</div>
                    <div class="text-lg lg:text-xl font-bold">${20 + (forecastDate.getDay() % 8)}°</div>
                `;
                container.appendChild(card);
            }
        }

        window.onload = () => {
            initClockMarkings();
            renderWeather();
            requestAnimationFrame(animateClock);
            setInterval(renderWeather, 3600000);
            setTimeout(fitText, 100); 
        };
    </script>
</body>
</html>
