<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard - Clock & Weather</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* Analog Clock Styling */
        #clock-wrapper {
            position: relative;
            width: 420px;
            height: 420px;
            flex-shrink: 0;
        }

        #clock-face {
            position: absolute;
            inset: 0;
            border: 8px solid #333;
            border-radius: 50%;
            background: radial-gradient(circle, #111 0%, #000 100%);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.05);
        }

        /* Hand Base Styles */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            z-index: 10;
            will-change: transform;
        }

        .hour-hand {
            width: 10px;
            height: 100px;
            background: #fff;
            margin-left: -5px;
        }

        .min-hand {
            width: 6px;
            height: 150px;
            background: #aaa;
            margin-left: -3px;
        }

        .second-hand {
            width: 2px;
            height: 180px;
            background: #ff3b30;
            z-index: 11;
            margin-left: -1px;
        }

        .center-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #ff3b30;
            border-radius: 50%;
            z-index: 12;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Perfect Circular Markings */
        .marking {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 18px;
            background: #444;
            transform-origin: center 190px; 
            margin-top: -190px; 
            margin-left: -1px;
        }

        .marking.major {
            height: 30px;
            width: 6px;
            background: #888;
            margin-left: -3px;
        }

        /* Digital Clock Typography */
        #digital-clock {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(6rem, 14vw, 12rem); 
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.05em;
            white-space: nowrap;
        }

        .weather-icon {
            width: 64px;
            height: 64px;
            fill: currentColor;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .current-weather-box {
            border-right: 1px solid #222;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .dots {
            animation: pulse 1s infinite;
        }

        /* Fullscreen Button Styling */
        #fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s ease;
        }

        #fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="p-8 lg:p-12">

    <!-- Fullscreen Toggle Button -->
    <button id="fullscreen-btn" title="Toggle Fullscreen">
        <svg id="fs-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
    </button>

    <!-- TOP SECTION -->
    <div class="flex-[3] grid grid-cols-2 gap-10 items-center overflow-hidden">
        <div class="flex justify-center items-center">
            <div id="clock-wrapper">
                <div id="clock-face">
                    <div id="markings-container" class="absolute inset-0"></div>
                    <div class="center-dot"></div>
                    <div id="hour-hand" class="hand hour-hand"></div>
                    <div id="min-hand" class="hand min-hand"></div>
                    <div id="second-hand" class="hand second-hand"></div>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-end pr-6 lg:pr-10 overflow-hidden">
            <div id="digital-clock" class="text-white">00:00</div>
            <div id="current-date" class="text-2xl lg:text-4xl font-light text-gray-400 mt-2 lg:mt-4 tracking-widest uppercase text-right">
                ---, --- --
            </div>
        </div>
    </div>

    <!-- BOTTOM SECTION -->
    <div class="flex-1 mt-8 grid grid-cols-12 gap-4 items-stretch border-t border-white/10 pt-8">
        <div class="col-span-4 current-weather-box flex items-center justify-center space-x-6 p-4">
            <div id="current-weather-icon" class="text-blue-400"></div>
            <div>
                <div id="current-temp" class="text-6xl lg:text-8xl font-bold leading-none">--°</div>
                <div id="current-desc" class="text-xl lg:text-2xl text-gray-400 font-light mt-1">---</div>
                <div id="current-extremes" class="text-lg text-gray-500 font-medium">H: --° L: --°</div>
            </div>
        </div>
        <div class="col-span-8 grid grid-cols-5 gap-3">
            <div id="forecast-container" class="contents"></div>
        </div>
    </div>

    <script>
        const icons = {
            sunny: `<svg class="weather-icon text-yellow-400" viewBox="0 0 24 24"><path d="M12,7c-2.76,0-5,2.24-5,5s2.24,5,5,5s5-2.24,5-5S14.76,7,12,7L12,7z M2,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S1.45,13,2,13L2,13z M20,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S19.45,13,20,13L20,13z M11,2l0,2c0,0.55,0.45,1,1,1s1-0.45,1-1l0-2c0-0.55-0.45-1-1-1S11,1.45,11,2L11,2z M11,20l0,2c0,0.55,0.45,1,1,1s1-0.45,1-1l0-2c0-0.55-0.45-1-1-1S11,19.45,11,20L11,20z M5.99,4.58c-0.39-0.39-1.03-0.39-1.41,0s-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0s0.39-1.03,0-1.41L5.99,4.58z M18.36,16.95c-0.39-0.39-1.03-0.39-1.41,0s-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0s0.39-1.03,0-1.41L18.36,16.95z M5.99,19.42l1.06-1.06c0.39-0.39,0.39-1.03,0-1.41s-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41S5.6,19.81,5.99,19.42z M18.36,7.05l1.06-1.06c0.39-0.39,0.39-1.03,0-1.41s-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41S17.97,7.44,18.36,7.05z"/></svg>`,
            cloudy: `<svg class="weather-icon text-gray-400" viewBox="0 0 24 24"><path d="M19.35,10.04C18.67,6.59,15.64,4,12,4C9.11,4,6.6,5.64,5.35,8.04C2.34,8.36,0,10.91,0,14c0,3.31,2.69,6,6,6h13 c2.76,0,5-2.24,5-5C24,12.36,21.95,10.22,19.35,10.04z"/></svg>`,
            rain: `<svg class="weather-icon text-blue-400" viewBox="0 0 24 24"><path d="M19.35,10.04C18.67,6.59,15.64,4,12,4C9.11,4,6.6,5.64,5.35,8.04C2.34,8.36,0,10.91,0,14c0,3.31,2.69,6,6,6h13 c2.76,0,5-2.24,5-5C24,12.36,21.95,10.22,19.35,10.04z M13,13v3h-2v-3H13z M17,13v3h-2v-3H17z M9,13v3H7v-3H9z"/></svg>`,
            thunder: `<svg class="weather-icon text-purple-400" viewBox="0 0 24 24"><path d="M19.35,10.04C18.67,6.59,15.64,4,12,4C9.11,4,6.6,5.64,5.35,8.04C2.34,8.36,0,10.91,0,14c0,3.31,2.69,6,6,6h13 c2.76,0,5-2.24,5-5C24,12.36,21.95,10.22,19.35,10.04z M9,21l3-3h-2l3-5l-3,3h2l-3,5z"/></svg>`
        };

        function initClockMarkings() {
            const container = document.getElementById('markings-container');
            for (let i = 0; i < 60; i++) {
                const mark = document.createElement('div');
                mark.className = i % 5 === 0 ? 'marking major' : 'marking';
                mark.style.transform = `rotate(${i * 6}deg)`;
                container.appendChild(mark);
            }
        }

        // --- FULLSCREEN LOGIC ---
        const fsBtn = document.getElementById('fullscreen-btn');
        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        document.addEventListener('fullscreenchange', () => {
            const icon = document.getElementById('fs-icon');
            if (document.fullscreenElement) {
                icon.innerHTML = '<path d="M4 14h6m0 0v6m0-6L3 21m17-7h-6m0 0v6m0-6 7 7M4 10h6m0 0V4m0 6L3 3m17 7h-6m0 0V4m0 6 7-7"></path>';
            } else {
                icon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>';
            }
        });

        // --- CLOCK ANIMATION ---
        let lastSecond = -1;

        function animateClock() {
            const now = new Date();
            const ms = now.getMilliseconds();
            const sec = now.getSeconds();
            const min = now.getMinutes();
            const hr = now.getHours();

            const smoothSec = sec + (ms / 1000);
            const smoothMin = min + (smoothSec / 60);
            const smoothHr = (hr % 12) + (smoothMin / 60);

            document.getElementById('second-hand').style.transform = `rotate(${smoothSec * 6}deg)`;
            document.getElementById('min-hand').style.transform = `rotate(${smoothMin * 6}deg)`;
            document.getElementById('hour-hand').style.transform = `rotate(${smoothHr * 30}deg)`;

            if (sec !== lastSecond) {
                const hStr = hr.toString().padStart(2, '0');
                const mStr = min.toString().padStart(2, '0');
                document.getElementById('digital-clock').innerHTML = `${hStr}<span class="dots text-gray-600">:</span>${mStr}`;

                const options = { weekday: 'short', month: 'short', day: '2-digit' };
                document.getElementById('current-date').innerText = now.toLocaleDateString('en-US', options);
                
                lastSecond = sec;
            }

            requestAnimationFrame(animateClock);
        }

        // --- DYNAMIC WEATHER LOGIC ---
        const weatherIconsList = ['sunny', 'cloudy', 'rain', 'thunder'];

        function renderWeather() {
            const now = new Date();
            
            // Current Weather
            document.getElementById('current-temp').innerText = `24°`;
            document.getElementById('current-desc').innerText = "Partly Cloudy";
            document.getElementById('current-extremes').innerText = "H: 28° L: 19°";
            document.getElementById('current-weather-icon').innerHTML = icons['cloudy'];

            // Dynamic 5-Day Forecast
            const container = document.getElementById('forecast-container');
            container.innerHTML = '';

            const dayNames = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
            
            for (let i = 1; i <= 5; i++) {
                const forecastDate = new Date();
                forecastDate.setDate(now.getDate() + i);
                const dayLabel = dayNames[forecastDate.getDay()];
                
                // Deterministic mock data based on the day of the week
                const mockIcon = weatherIconsList[(forecastDate.getDay()) % weatherIconsList.length];
                const mockTemp = 20 + (forecastDate.getDay() % 8);

                const card = document.createElement('div');
                card.className = "forecast-card flex flex-col items-center justify-center p-4 rounded-xl";
                card.innerHTML = `
                    <div class="text-lg lg:text-xl font-semibold mb-2 text-gray-400">${dayLabel}</div>
                    <div class="mb-2 scale-75 lg:scale-100">${icons[mockIcon]}</div>
                    <div class="text-2xl lg:text-3xl font-bold">${mockTemp}°</div>
                `;
                container.appendChild(card);
            }
        }

        window.onload = () => {
            initClockMarkings();
            renderWeather();
            requestAnimationFrame(animateClock);

            // Re-render weather forecast every hour to keep "Day 1" fresh
            setInterval(renderWeather, 3600000);
        };
    </script>
</body>
</html>
